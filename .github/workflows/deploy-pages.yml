# Publishes BM Locator to GitHub Pages whenever main changes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs (see the jobs below).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code and download the map-data release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The whole-world map lives on Cloudflare R2 (build-world-map.yml writes latest.txt there).
      - name: Find the whole-world map
        id: world
        if: vars.R2_PUBLIC_URL != ''
        env:
          BASE: ${{ vars.R2_PUBLIC_URL }}
        run: |
          f=$(curl -fsSL --retry 3 "${BASE%/}/latest.txt" | tr -d '[:space:]' || true)
          if [ -n "$f" ]; then echo "url=${BASE%/}/$f" >> "$GITHUB_OUTPUT"; echo "World map: $f"; else echo "No world map yet."; fi
      - run: npm run build
        env:
          VITE_MAP_DATA_URL: ${{ steps.world.outputs.url }}
      # Our own map tiles (built by build-map-data.yml) ride along with the site when they exist.
      - name: Add BM Locator map data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist/tiles
          gh release download map-data -p bm-locator.pmtiles -D dist/tiles \
            && ls -lh dist/tiles \
            || echo "No map-data release yet; the map uses OpenFreeMap tiles everywhere."
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that this run is from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
