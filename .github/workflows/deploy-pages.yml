# Publishes BM Locator to GitHub Pages whenever main changes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs (see the jobs below).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code and download the map-data release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The whole-world map lives on Cloudflare R2 (build-world-map.yml writes latest.txt there).
      - name: Find the whole-world map
        id: world
        if: vars.R2_PUBLIC_URL != ''
        env:
          BASE: ${{ vars.R2_PUBLIC_URL }}
        run: |
          f=$(curl -fsSL --retry 3 "${BASE%/}/latest.txt" | tr -d '[:space:]' || true)
          if [ -n "$f" ]; then echo "url=${BASE%/}/$f" >> "$GITHUB_OUTPUT"; echo "World map: $f"; else echo "No world map yet."; fi
      - run: npm run build
        env:
          VITE_MAP_DATA_URL: ${{ steps.world.outputs.url }}
      # Our own map tiles (built by build-map-data.yml) ride along with the site when they exist.
      - name: Add BM Locator map data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist/tiles
          gh release download map-data -p bm-locator.pmtiles -D dist/tiles \
            && ls -lh dist/tiles \
            || echo "No map-data release yet; the map uses OpenFreeMap tiles everywhere."
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that this run is from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
