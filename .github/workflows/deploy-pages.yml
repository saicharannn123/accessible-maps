# Publishes BM Locator to GitHub Pages whenever main changes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The whole-world map lives on Cloudflare R2 (build-world-map.yml writes latest.txt there).
      - name: Find the whole-world map
        id: world
        if: vars.R2_PUBLIC_URL != ''
        env:
          BASE: ${{ vars.R2_PUBLIC_URL }}
        run: |
          f=$(curl -fsSL --retry 3 "${BASE%/}/latest.txt" | tr -d '[:space:]' || true)
          if [ -n "$f" ]; then echo "url=${BASE%/}/$f" >> "$GITHUB_OUTPUT"; echo "World map: $f"; else echo "No world map yet."; fi
      - run: npm run build
        env:
          VITE_MAP_DATA_URL: ${{ steps.world.outputs.url }}
      # Our own map tiles (built by build-map-data.yml) ride along with the site when they exist.
      - name: Add BM Locator map data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist/tiles
          gh release download map-data -p bm-locator.pmtiles -D dist/tiles \
            && ls -lh dist/tiles \
            || echo "No map-data release yet; the map uses OpenFreeMap tiles everywhere."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
