# Builds BM Locator's whole-world map from today's OpenStreetMap data and stores it on Cloudflare R2.
#
# The world is too big for GitHub's free machines (about 100 GB of tiles, ~128 GB of memory to
# build), so this job rents a large Hetzner Cloud server by the hour, runs scripts/build-world-map.sh
# on it, and deletes the server again whether the build worked or not. Then it redeploys the site
# so the app points at the new file. A run costs roughly $1-2 of server time.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   Secrets:   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, HCLOUD_TOKEN
#   Variables: R2_PUBLIC_URL (the bucket's public URL), optional R2_BUCKET (default bm-locator-maps),
#              HCLOUD_SERVER_TYPE (default ccx63), HCLOUD_LOCATION (default fsn1)
# Until the secrets exist the job skips itself.
name: Build world map

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 4' # every Thursday, after the weekly planet file is out

permissions:
  contents: read
  actions: write # start the site redeploy at the end

concurrency:
  group: world-map
  cancel-in-progress: false

env:
  PLANETILER_VERSION: '0.9.2'
  PLANETILER_SHA256: c8fb2477267a8f59545299e4fa0ac02d35a518079305cc396d4c41d059145cdd
  # The Hetzner command-line tool handles the HCLOUD_TOKEN secret, so use a fixed, checked version.
  HCLOUD_CLI_VERSION: '1.71.0'
  HCLOUD_CLI_SHA256: ab14e964074ea61c9b103df852134833787da9df094ed6967f7bb0b588e7abc9
  R2_BUCKET: ${{ vars.R2_BUCKET || 'bm-locator-maps' }}
  SERVER_TYPE: ${{ vars.HCLOUD_SERVER_TYPE || 'ccx63' }}
  LOCATION: ${{ vars.HCLOUD_LOCATION || 'fsn1' }}
  SERVER_NAME: bm-world-${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the accounts are connected
        id: ready
        env:
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' }}
          HAS_HCLOUD: ${{ secrets.HCLOUD_TOKEN != '' }}
        run: |
          if [ "$HAS_R2" = true ] && [ "$HAS_HCLOUD" = true ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: add R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and HCLOUD_TOKEN as repo secrets to build the world map."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Let the BM Locator site read the bucket (CORS)
        if: steps.ready.outputs.ok == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          cat > cors.json <<JSON
          {"CORSRules":[{"AllowedOrigins":["$ORIGIN","http://localhost:5173","http://localhost:4173"],
            "AllowedMethods":["GET","HEAD"],"AllowedHeaders":["range","if-match"],
            "ExposeHeaders":["etag"],"MaxAgeSeconds":86400}]}
          JSON
          aws s3api put-bucket-cors --endpoint-url "$ENDPOINT" --bucket "$R2_BUCKET" --cors-configuration file://cors.json

      - name: Rent the build server
        id: server
        if: steps.ready.outputs.ok == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -fsSL -o hcloud.tar.gz "https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_CLI_VERSION}/hcloud-linux-amd64.tar.gz"
          echo "$HCLOUD_CLI_SHA256  hcloud.tar.gz" | sha256sum -c -
          tar -xzf hcloud.tar.gz hcloud
          sudo mv hcloud /usr/local/bin/
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/build"
          hcloud ssh-key create --name "$SERVER_NAME" --public-key-from-file "$HOME/.ssh/build.pub"
          hcloud server create --name "$SERVER_NAME" --type "$SERVER_TYPE" --location "$LOCATION" \
            --image ubuntu-24.04 --ssh-key "$SERVER_NAME"
          echo "ip=$(hcloud server ip "$SERVER_NAME")" >> "$GITHUB_OUTPUT"
          echo "id=$(hcloud server describe "$SERVER_NAME" -o format='{{.ID}}')" >> "$GITHUB_OUTPUT"

      - name: Build the world map on it (about 2-3 hours)
        if: steps.ready.outputs.ok == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
          SERVER_ID: ${{ steps.server.outputs.id }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          SSH="ssh -i $HOME/.ssh/build -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 root@$IP"
          for i in $(seq 1 30); do $SSH true 2>/dev/null && break; sleep 10; done
          scp -i "$HOME/.ssh/build" -o StrictHostKeyChecking=no scripts/build-world-map.sh "root@$IP:/root/"
          # Secrets go over SSH on stdin, never on a command line or into the log.
          printf 'export R2_ACCOUNT_ID=%q R2_ACCESS_KEY_ID=%q R2_SECRET_ACCESS_KEY=%q R2_BUCKET=%q PLANETILER_VERSION=%q PLANETILER_SHA256=%q HCLOUD_TOKEN=%q SERVER_ID=%q\nbash /root/build-world-map.sh\n' \
            "$R2_ACCOUNT_ID" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_BUCKET" "$PLANETILER_VERSION" "$PLANETILER_SHA256" "$HCLOUD_TOKEN" "$SERVER_ID" \
            | $SSH bash -s

      - name: Delete the build server
        if: always() && steps.ready.outputs.ok == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          hcloud server delete "$SERVER_NAME" || true
          hcloud ssh-key delete "$SERVER_NAME" || true

      - name: Redeploy the site with the new world map
        if: steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --ref main
